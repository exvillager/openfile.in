# Local Postgres for api-go, on 5433 so it doesn't clash with other projects on 5432.
# Usage: docker compose -f compose.local.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: openfile-go
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d openfile-go"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
